server.port=9876
#database
spring.datasource.url=${DB-SOURCE}
spring.datasource.username=${DB-LOGIN}
spring.datasource.password=${DB-PASSWORD}

#jpa settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.default_schema=gym

#https://editor.swagger.io/
#http://localhost:8080/swagger-ui/index.html

# Kafka broker address
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=gzip

kafka.mail.group=group_id
kafka.max.attempts=10
kafka.mail.queue.rate.ms=5000

mock.gym.admin.mail=admin.gym@mmt.com
mock.gym.admin.password=PasswordMMT!123
mock.gym.admin.nickname=GymAdmin
